name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          targets=(
            darwin/amd64
            darwin/arm64
            linux/amd64
            linux/arm64
            windows/amd64
            windows/arm64
          )
          for target in "${targets[@]}"; do
            os="${target%/*}"
            arch="${target#*/}"
            bin="transferit"
            archive="transferit_${os}_${arch}.tar.gz"
            if [ "$os" = "windows" ]; then
              bin="transferit.exe"
              archive="transferit_${os}_${arch}.zip"
            fi
            echo "building ${os}/${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X transferit/internal/version.Label=${version}" \
              -o "$bin" \
              ./cmd/transferit
            if [ "$os" = "windows" ]; then
              zip -q "dist/${archive}" "$bin"
            else
              tar -czf "dist/${archive}" "$bin"
            fi
            rm -f "$bin"
          done
          cd dist
          sha256sum -- * > SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
